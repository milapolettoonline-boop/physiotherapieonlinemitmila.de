<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- MODELO INTERNO: não publicar nem indexar. Copiar para ebook/books/<categoria>/<slug>/index.html e substituir todos os {{MARCADORES}}. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="{{DESCRICAO_SEO}}">
    <link rel="canonical" href="https://milaphysio.de/ebook/books/{{CATEGORIA}}/{{SLUG}}/">
    <meta property="og:type" content="book">
    <meta property="og:title" content="{{TITULO_SEO}}">
    <meta property="og:description" content="{{DESCRICAO_SEO}}">
    <meta property="og:url" content="https://milaphysio.de/ebook/books/{{CATEGORIA}}/{{SLUG}}/">
    <meta property="og:image" content="https://milaphysio.de/ebook/images/{{CAPA_URL}}">
    <title>{{TITULO_SEO}}</title>
    <style>
        :root {
            --teal: #155d60;
            --teal-dark: #10494b;
            --gold: #c89435;
            --cream: #f7f3ec;
            --white: #fff;
            --ink: #263238;
            --muted: #647174;
            --line: #e8e2d8;
            --serif: Georgia, "Times New Roman", serif;
            --sans: Arial, Helvetica, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--cream); font: 16px/1.7 var(--sans); }
        img { display: block; max-width: 100%; }
        a { color: inherit; }
        .wrap { width: min(1060px, calc(100% - 40px)); margin: 0 auto; }
        .site-header { padding: 18px 0; background: var(--white); border-bottom: 1px solid var(--line); }
        .brand { display: flex; justify-content: center; }
        .brand img { width: min(190px, 48vw); height: 70px; object-fit: contain; }
        .hero { padding: clamp(44px, 7vw, 80px) 0; }
        .book { display: grid; grid-template-columns: minmax(250px, .8fr) minmax(0, 1.2fr); align-items: center; gap: clamp(28px, 6vw, 70px); padding: clamp(24px, 5vw, 54px); border: 1px solid var(--line); border-radius: 20px; background: var(--white); box-shadow: 0 14px 36px rgba(24, 57, 58, .08); }
        .cover { display: flex; justify-content: center; align-items: center; padding: 12px; background: var(--cream); border-radius: 12px; }
        .cover img { width: 100%; max-height: 500px; object-fit: contain; }
        .eyebrow { margin: 0 0 10px; color: var(--gold); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        h1, h2 { font-family: var(--serif); line-height: 1.2; }
        h1 { margin: 0 0 12px; color: var(--teal-dark); font-size: clamp(2rem, 4.6vw, 3.1rem); font-weight: 500; }
        .subtitle { margin: 0 0 18px; color: var(--ink); font-family: var(--serif); font-size: 1.1rem; }
        .description { margin: 0 0 18px; color: var(--muted); }
        h2 { margin: 36px 0 12px; color: var(--teal-dark); font-size: 1.5rem; }
        .notice { margin: 24px 0 0; padding: 16px 18px; border-left: 4px solid var(--gold); background: var(--cream); font-size: .94rem; }
        .button { display: inline-flex; min-height: 50px; align-items: center; justify-content: center; margin-top: 8px; padding: 12px 22px; border: 1px solid var(--gold); border-radius: 999px; color: #1f1a12; background: var(--gold); font-weight: 700; text-align: center; text-decoration: none; }
        .button:hover, .button:focus-visible { color: #fff; background: #a87825; border-color: #a87825; }
        .button-secondary { color: var(--teal); background: transparent; border-color: var(--teal); }
        .button-secondary:hover, .button-secondary:focus-visible { color: #fff; background: var(--teal); }
        .return-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 32px; }
        .site-footer { padding: 22px 0; color: var(--muted); text-align: center; font-size: .88rem; }
        .site-footer p { margin: 0; }
        @media (max-width: 720px) {
            .book { grid-template-columns: 1fr; }
            .cover img { max-height: 440px; width: auto; }
        }
        @media (max-width: 500px) {
            .wrap { width: min(100% - 32px, 1060px); }
            .book { padding: 18px; }
            .return-links { flex-direction: column; }
            .return-links .button { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
<!-- Locally hosted Klaro! consent management -->
<link rel="stylesheet" href="/consent/vendor/klaro.min.css">
<link rel="stylesheet" href="/consent/consent.css">
<script defer src="/consent/klaro-config.js"></script>
<script defer data-config="klaroConfig" src="/consent/vendor/klaro.js"></script>
<script defer src="/consent/consent-ui.js"></script>
<script defer src="/consent/tracking-events.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="wrap brand">
            <a href="/" aria-label="MILAPHYSIO Homepage">
                <img src="../../../../logo/Mila-logo.webp" alt="MILAPHYSIO – Physiotherapie mit Mila" width="190" height="70">
            </a>
        </div>
    </header>

    <main class="wrap">
        <section class="hero" aria-labelledby="page-title">
            <article class="book">
                <div class="cover">
                    <img src="../../../images/{{CAPA_ARQUIVO}}" alt="{{CAPA_ALT}}" width="{{CAPA_LARGURA}}" height="{{CAPA_ALTURA}}">
                </div>
                <div>
                    <p class="eyebrow">{{RUBRICA}}</p>
                    <h1 id="page-title">{{TITULO}}</h1>
                    {{SUBTITULO_BLOCO}}
                    <p class="description">{{DESCRICAO}}</p>
                    {{BLOCO_AMAZON}}
                </div>
            </article>

            {{BLOCO_AVISO}}

            <nav class="return-links" aria-label="Navigation">
                <a class="button button-secondary" href="../../../{{CATALOGO}}/">Zurück zum Katalog</a>
                <a class="button button-secondary" href="../../../index.html">Zurück zur Buchauswahl</a>
                <a class="button button-secondary" href="https://milaphysio.de/">Zur Homepage</a>
            </nav>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>MILAPHYSIO · Physiotherapie mit Mila</p></div>
    </footer>
</body>
</html>
