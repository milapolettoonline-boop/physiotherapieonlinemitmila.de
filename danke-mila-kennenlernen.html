<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vielen Dank – Kennenlernen mit Mila | MILAPHYSIO</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f7f4ef;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 40px 20px;
            padding: 50px 35px;
            background: #ffffff;
            border: 2px solid #b89b5e;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333333;
            margin: 0 0 15px;
        }

        .success {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #b89b5e;
        }

        .next-step {
            margin-top: 22px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background: #b89b5e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }

        .btn:hover,
        .btn:focus-visible {
            opacity: 0.9;
        }

        .btn:focus-visible {
            outline: 3px solid #1a1a1a;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 24px 16px;
                padding: 38px 24px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .btn {
                display: block;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="success" aria-hidden="true">✓</div>

        <h1>Vielen Dank für Ihre Zahlung!</h1>

        <p>Ihre Zahlung für das Kennenlerngespräch mit Mila war erfolgreich.</p>

        <p class="next-step">Der nächste Schritt: Buchen Sie jetzt Ihren persönlichen Termin.</p>

        <a
            href="https://calendly.com/milapoletto-online/kennenlernen-mit-mila-15-min"
            class="btn"
            target="_blank"
            rel="noopener noreferrer"
        >
            Jetzt Termin bei Mila buchen
        </a>
    </main>
</body>
</html>
