<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Übungen | Patientenportal Mila Physio</title>
    <link rel="stylesheet" href="style_patientenportal.css">
</head>
<body>
    <!-- Header / Navigation -->
    <header class="portal-header">
        <div class="header-container">
            <a href="../index.html" class="header-logo-link">
                <img src="Images/mila-logo.webp" alt="Mila Physio" class="logo-img">
            </a>

            <nav class="header-nav">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="termine.html" class="nav-link">Meine Termine</a>
                <a href="uebungen.html" class="nav-link active">Meine Übungen</a>
                <a href="profil.html" class="nav-link">Mein Profil</a>
            </nav>

            <div class="header-actions">
                <button class="btn-profile" id="profileBtn" title="Profil">👤</button>
                <button class="btn-logout" id="logoutBtn" title="Abmelden">↪️</button>
            </div>

            <button class="btn-menu" id="menuBtn">☰</button>
        </div>
    </header>

    <!-- Mobile Menu -->
    <nav class="mobile-menu" id="mobileMenu">
        <a href="index.html" class="mobile-nav-link">Dashboard</a>
        <a href="termine.html" class="mobile-nav-link">Meine Termine</a>
        <a href="uebungen.html" class="mobile-nav-link active">Meine Übungen</a>
        <a href="profil.html" class="mobile-nav-link">Mein Profil</a>
        <hr>
        <button class="mobile-nav-logout" id="mobileLogoutBtn">Abmelden</button>
    </nav>

    <!-- Main Content -->
    <main class="portal-main">
        <!-- Page Header -->
        <section class="section-page-header">
            <h1 class="page-title">Meine Übungen</h1>
            <p class="page-subtitle">Dein persönlicher Übungsplan</p>
        </section>

        <!-- Filter Section -->
        <section class="section-filters">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Alle</button>
                <button class="filter-btn" data-filter="Mobilität">Mobilität</button>
                <button class="filter-btn" data-filter="Kräftigung">Kräftigung</button>
                <button class="filter-btn" data-filter="Dehnung">Dehnung</button>
            </div>
        </section>

        <!-- Exercises Grid -->
        <section class="section-exercises">
            <div class="grid-3" id="exercisesGrid">
                <!-- Loaded by JavaScript -->
            </div>
        </section>

        <!-- Exercise Details Modal (hidden by default) -->
        <div class="modal" id="exerciseModal">
            <div class="modal-content">
                <button class="modal-close" id="closeModal">&times;</button>
                <div id="exerciseDetails"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="portal-footer">
        <div class="footer-content">
            <p>&copy; 2026 Mila Physio. Patientenportal.</p>
            <div class="footer-links">
                <a href="../datenschutz.html">Datenschutz</a>
                <a href="../impressum.html">Impressum</a>
                <a href="../kontakt.html">Kontakt</a>
            </div>
        </div>
    </footer>

    <script src="script_patientenportal.js"></script>
    <script>
        // DEMO ONLY – später durch sichere API ersetzen
        document.addEventListener('DOMContentLoaded', function() {
            protectPatientPage();
            loadExercisesPage();
            setupMobileMenu();
            setupFilters();
        });

        function setupMobileMenu() {
            const menuBtn = document.getElementById('menuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');

            menuBtn.addEventListener('click', function() {
                mobileMenu.classList.toggle('active');
            });

            mobileLogoutBtn.addEventListener('click', logoutPatient);

            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                link.addEventListener('click', function() {
                    mobileMenu.classList.remove('active');
                });
            });
        }

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const filter = this.getAttribute('data-filter');
                    filterExercises(filter);
                });
            });
        }

        function filterExercises(category) {
            const exercises = document.querySelectorAll('.exercise-card');
            exercises.forEach(exercise => {
                if (category === 'all' || exercise.getAttribute('data-category') === category) {
                    exercise.style.display = 'block';
                } else {
                    exercise.style.display = 'none';
                }
            });
        }

        async function loadExercisesPage() {
            // Load exercises from API
            const grid = document.getElementById('exercisesGrid');
            grid.innerHTML = '<p style="text-align: center; padding: 2rem;">Übungen werden geladen...</p>';

            try {
                const response = await fetch('http://localhost:3000/api/exercises', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });

                if (response.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                const exercises = data.data || [];

                if (exercises.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; padding: 2rem; color: #666;">Derzeit sind keine Übungen für Sie hinterlegt.</p>';
                    return;
                }

                const categoryIcons = {
                    'Mobilität': '🧘', 'Kräftigung': '💪', 'Dehnung': '🧘',
                    'Kardio': '🏃', 'Stabilität': '⚡', 'Andere': '🎯'
                };

                grid.innerHTML = exercises.map(exercise => {
                    const escapedTitle = (exercise.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const escapedDesc = (exercise.description || '').replace(/'/g, "\\'");
                    const escapedInstructions = (exercise.instructions || '').replace(/'/g, "\\'");
                    const escapedFrequency = (exercise.frequency || '').replace(/'/g, "\\'");
                    const icon = categoryIcons[exercise.category] || '🎯';

                    return `
                        <div class="exercise-card" data-category="${exercise.category || 'Andere'}">
                            <div class="exercise-icon">${icon}</div>
                            <div class="exercise-header">
                                <h3 class="exercise-name">${exercise.title}</h3>
                                <span class="exercise-category">${exercise.category || 'Andere'}</span>
                            </div>
                            <p class="exercise-description">${exercise.description || ''}</p>
                            <div class="exercise-details">
                                ${exercise.sets_or_reps ? `<span>📊 ${exercise.sets_or_reps}</span>` : ''}
                            </div>
                            ${exercise.frequency ? `<p class="exercise-frequency"><strong>Häufigkeit:</strong> ${exercise.frequency}</p>` : ''}
                            <button class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="showExerciseDetails('${exercise.id}', '${escapedTitle}', '${escapedDesc}', '${escapedInstructions}', '${escapedFrequency}'${exercise.video_url ? `, '${exercise.video_url.replace(/'/g, "\\'")}'` : ''})">Übung ansehen</button>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading exercises:', error);
                grid.innerHTML = '<p style="text-align: center; padding: 2rem; color: #d32f2f;">Ein Fehler ist beim Laden der Übungen aufgetreten. Bitte versuchen Sie es später erneut.</p>';
            }
        }

        function showExerciseDetails(id, name, description, instructions, frequency, videoUrl) {
            const modal = document.getElementById('exerciseModal');
            const detailsDiv = document.getElementById('exerciseDetails');

            let videoHtml = '';
            if (videoUrl) {
                videoHtml = `
                    <div class="modal-section">
                        <h3>Video</h3>
                        <a href="${videoUrl}" target="_blank" class="btn btn-secondary" style="display: inline-block;">Video ansehen →</a>
                    </div>
                `;
            }

            detailsDiv.innerHTML = `
                <h2>${name}</h2>
                <p class="modal-description">${description}</p>

                ${videoHtml}

                <div class="modal-section">
                    <h3>Anleitung</h3>
                    <p>${instructions}</p>
                </div>

                <div class="modal-section">
                    <h3>Häufigkeit</h3>
                    <p>${frequency}</p>
                </div>

                <div class="modal-section">
                    <h3>Tipps</h3>
                    <ul>
                        <li>Führen Sie alle Bewegungen langsam und kontrolliert durch</li>
                        <li>Atmen Sie während der Übung normal</li>
                        <li>Wenn Schmerz auftritt, stoppen Sie sofort</li>
                        <li>Halten Sie sich an den vorgegebenen Zeitplan</li>
                    </ul>
                </div>
            `;

            modal.classList.add('active');
        }

        // Close modal
        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('exerciseModal').classList.remove('active');
        });

        document.getElementById('exerciseModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });

        // Event listeners
        document.getElementById('profileBtn').addEventListener('click', function() {
            window.location.href = 'profil.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', logoutPatient);
    </script>
</body>
</html>
