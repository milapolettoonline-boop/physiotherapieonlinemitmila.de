<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden | Therapeut Portal</title>
    <link rel="stylesheet" href="style_therapeutportal.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
        }

        .login-card {
            background-color: var(--bg-white);
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            max-width: 400px;
            width: 90%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            height: 50px;
            margin-bottom: 1rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .login-footer {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../logo/logo.svg" alt="Mila Physio" class="login-logo" onerror="this.style.display='none'">
                <h1 class="login-title">Therapeut Portal</h1>
                <p class="login-subtitle">Verwaltung & Abrechnung</p>
            </div>

            <div id="alertsContainer"></div>

            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email" class="form-label">E-Mail-Adresse</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="beispiel@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Passwort</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                    Anmelden
                </button>
            </form>

            <div class="login-footer">
                <p>Passwort vergessen? <a href="#">Hilfe anfordern</a></p>
            </div>
        </div>
    </div>

    <script src="script_therapeutportal.js"></script>
</body>
</html>
