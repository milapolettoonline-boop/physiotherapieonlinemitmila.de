<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Patientenportal - Anmelden | Mila Physio</title>
    <link rel="stylesheet" href="style_patientenportal.css">
</head>
<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Logo & Header -->
            <div class="login-header">
                <a href="../index.html" class="login-logo-link">
                    <img src="Images/mila-logo.webp" alt="Mila Physio" class="login-logo-img">
                </a>
                <h1 class="login-title">Willkommen im Patientenportal</h1>
                <p class="login-subtitle">Verwalten Sie Ihre Termine und Übungen</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" placeholder="ihre.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                    Anmelden
                </button>
            </form>

            <!-- Error Message -->
            <div class="login-error" id="errorMessage" style="display: none; color: #d32f2f; margin-top: 1rem; padding: 0.75rem; border-radius: 4px; background-color: #ffebee;"></div>

            <!-- Links -->
            <div class="login-links">
                <a href="#" class="link-secondary">Passwort vergessen?</a>
                <span class="divider">•</span>
                <a href="../index.html" class="link-secondary">Zurück zu Mila Physio</a>
            </div>

            <!-- Security Note -->
            <div class="security-note">
                <p>🔒 Ihre Anmeldedaten sind sicher geschützt. Das Portal wird zu Ihrem Schutz regelmäßig überprüft.</p>
            </div>
        </div>
    </div>

    <script src="script_patientenportal.js"></script>
    <script>
        // Real login via API
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            // Clear previous errors
            errorMessage.style.display = 'none';

            // Disable button during login
            loginBtn.disabled = true;
            loginBtn.textContent = 'Wird angemeldet...';

            // Call real login function
            const success = await loginPatientReal(email, password);

            if (!success) {
                // Re-enable button on error
                loginBtn.disabled = false;
                loginBtn.textContent = 'Anmelden';
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Anmeldung fehlgeschlagen. Bitte überprüfen Sie Ihre E-Mail und Ihr Passwort.';
            }
        });
    </script>
</body>
</html>
